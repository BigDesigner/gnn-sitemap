name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify PHP syntax
        run: find gnn-sitemap -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Verify VERSION matches tag
        run: |
          file_version=$(tr -d '[:space:]' < gnn-sitemap/VERSION)
          if [ "$file_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "VERSION ($file_version) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Build clean plugin folder
        run: |
          mkdir -p build
          cp -r gnn-sitemap build/gnn-sitemap

      - name: Zip plugin
        run: |
          cd build
          zip -r "gnn-sitemap-${{ steps.version.outputs.version }}.zip" gnn-sitemap

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            GNN Sitemap ${{ github.ref_name }}

            The built package is attached.
          files: build/gnn-sitemap-${{ steps.version.outputs.version }}.zip
